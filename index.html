<style>
/* Layout: PropertyGuru-style. Index of listing cards; each opens a detail view with gallery above, facts beside, description below. */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --ink: #14202b;
  --muted: #5b6b7a;
  --line: #dde3e9;
  --accent: #0b6e75;
  --accent-ink: #ffffff;
  --accent-soft: #e0f1f2;
  --warn-bg: #fff3d6;
  --warn-ink: #7a5200;
  --ok-bg: #dff3e6;
  --ok-ink: #1c6b3a;
  --stage: #e7ecf0;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171e; --surface: #17222b; --ink: #e8eef3; --muted: #94a5b4; --line: #2a3945;
    --accent: #55c2c9; --accent-ink: #08262a; --accent-soft: #163b40;
    --warn-bg: #3d3112; --warn-ink: #f0cf7a; --ok-bg: #173a27; --ok-ink: #8fdcab; --stage: #0b1117;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171e; --surface: #17222b; --ink: #e8eef3; --muted: #94a5b4; --line: #2a3945;
  --accent: #55c2c9; --accent-ink: #08262a; --accent-soft: #163b40;
  --warn-bg: #3d3112; --warn-ink: #f0cf7a; --ok-bg: #173a27; --ok-ink: #8fdcab; --stage: #0b1117;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 1120px; margin: 0 auto; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px; flex-wrap: wrap; }
.brand { font-weight: 800; font-size: 18px; letter-spacing: -0.01em; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: var(--warn-bg); color: var(--warn-ink); padding: 4px 10px; border-radius: 4px; }

.bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.bar input, .bar select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; }
.bar input { flex: 1 1 220px; }
.bar select { flex: 0 1 160px; }
.count { color: var(--muted); font-size: 13px; margin: 0 0 12px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; text-decoration: none; color: inherit; display: flex; flex-direction: column; text-align: left; padding: 0; }
.card:hover { border-color: var(--accent); }
.card .ph { position: relative; aspect-ratio: 4 / 3; background: var(--stage); }
.card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pill { position: absolute; left: 10px; top: 10px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--ok-bg); color: var(--ok-ink); }
.pill.sold { background: var(--warn-bg); color: var(--warn-ink); }
.pics { position: absolute; right: 10px; bottom: 10px; font-size: 12px; font-weight: 600; background: rgba(10,18,24,.72); color: #fff; padding: 3px 9px; border-radius: 99px; }
.card .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.price { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.name { font-weight: 700; }
.addr { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip { font-size: 12.5px; background: var(--accent-soft); color: var(--accent); font-weight: 600; padding: 3px 9px; border-radius: 4px; font-variant-numeric: tabular-nums; }
.empty { padding: 40px 0; color: var(--muted); }

/* detail */
.back { background: none; border: 0; padding: 6px 0; color: var(--accent); font-weight: 600; margin-bottom: 8px; }
.detail { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.gallery, .panel, .section { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.stage { position: relative; aspect-ratio: 4 / 3; background: var(--stage); border-radius: 8px 8px 0 0; overflow: hidden; }
.stage img { width: 100%; height: 100%; object-fit: contain; display: block; cursor: zoom-in; }
.nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(10,18,24,.65); color: #fff; font-size: 20px; line-height: 1; }
.nav.prev { left: 10px; } .nav.next { right: 10px; }
.cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 14px 10px; background: linear-gradient(transparent, rgba(10,18,24,.7)); color: #fff; font-size: 13px; display: flex; justify-content: space-between; gap: 10px; }
.thumbs { display: flex; gap: 8px; padding: 10px; overflow-x: auto; }
.thumbs button { flex: 0 0 84px; height: 62px; padding: 0; border: 2px solid transparent; border-radius: 4px; overflow: hidden; background: var(--stage); opacity: .7; }
.thumbs button[aria-current="true"] { border-color: var(--accent); opacity: 1; }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }

.panel { padding: 18px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 12px; min-width: 0; }
.panel h1 { font-size: 20px; line-height: 1.25; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.panel .big { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.lbl { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.own { background: var(--warn-bg); color: var(--warn-ink); border-radius: 6px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.own b { font-size: 18px; font-variant-numeric: tabular-nums; }
.own .lbl { color: inherit; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font-size: 12px; color: var(--muted); }
.facts dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 9px 14px; font-weight: 600; text-decoration: none; color: var(--ink); text-align: center; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.phone { font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; user-select: all; }

.section { padding: 18px; margin-top: 18px; }
.section h2 { font-size: 16px; margin: 0 0 10px; }
.section p { margin: 0 0 8px; max-width: 68ch; overflow-wrap: anywhere; }
.vid { display: block; width: 100%; max-width: 360px; max-height: 75vh; background: #000; border-radius: 6px; }
.doc { border-top: 1px solid var(--line); padding: 10px 0; }
.doc summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.pages { display: grid; gap: 10px; margin-top: 10px; max-width: 900px; }
.pages img { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 4px; background: #fff; display: block; }
.section p.line { margin: 0 0 4px; }
.muted { color: var(--muted); }
.updated { font-size: 12.5px; color: var(--muted); }

.lb { position: fixed; inset: 0; background: rgba(6,10,14,.94); z-index: 50; display: flex; align-items: center; justify-content: center; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
.lb img { max-width: 100%; max-height: 100%; object-fit: contain; }
.lb .x { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: max(12px, env(safe-area-inset-top, 0px)); background: rgba(255,255,255,.16); color: #fff; border: 0; border-radius: 50%; width: 42px; height: 42px; font-size: 22px; }
.lb .nav.prev { left: max(10px, env(safe-area-inset-left, 0px)); } .lb .nav.next { right: max(10px, env(safe-area-inset-right, 0px)); }

@media (max-width: 860px) {
  .detail { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; }
}
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } }
</style>

const $ = (s, r) => (r || document).querySelector(s);
const rm = n => "RM " + n.toLocaleString("en-MY");
const rmShort = n => "RM " + (n / 1e6).toFixed(n % 1e6 === 0 ? 1 : 2) + "m";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sqft = n => n.toLocaleString("en-MY") + " sqft";
const app = $("#app");
let filters = { q: "", type: "", status: "" };
let cur = 0, lbOpen = false;

function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  const p = PROPERTIES.find(x => x.id === id);
  p ? renderDetail(p) : renderIndex();
}

function renderIndex() {
  document.title = "Team Property Listings";
  const types = [...new Set(PROPERTIES.map(p => p.type))];
  const statuses = [...new Set(PROPERTIES.map(p => p.status))];
  app.innerHTML = `
    <div class="bar">
      <input id="q" type="search" placeholder="Search project, street or area" value="${esc(filters.q)}" aria-label="Search listings">
      <select id="ftype" aria-label="Property type"><option value="">All types</option>${types.map(t => `<option ${t === filters.type ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
      <select id="fstatus" aria-label="Status"><option value="">All status</option>${statuses.map(t => `<option ${t === filters.status ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
    </div>
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>`;
  $("#q").oninput = e => { filters.q = e.target.value; drawGrid(); };
  $("#ftype").onchange = e => { filters.type = e.target.value; drawGrid(); };
  $("#fstatus").onchange = e => { filters.status = e.target.value; drawGrid(); };
  drawGrid();
}

function drawGrid() {
  const q = filters.q.trim().toLowerCase();
  const list = PROPERTIES.filter(p =>
    (!q || [p.project, p.address, p.area, p.type].join(" ").toLowerCase().includes(q)) &&
    (!filters.type || p.type === filters.type) && (!filters.status || p.status === filters.status));
  $("#count").textContent = list.length + (list.length === 1 ? " listing" : " listings");
  $("#grid").innerHTML = list.length ? list.map(p => `
    <a class="card" href="#${esc(p.id)}">
      <div class="ph"><img src="${esc(p.photos[0][0])}" alt="${esc(p.photos[0][1])}" loading="lazy">
        <span class="pill ${p.status === "Available" ? "" : "sold"}">${esc(p.status)}</span>
        <span class="pics">${p.photos.length} photos${p.video ? " + video" : ""}</span></div>
      <div class="body">
        <div class="price">${p.asking ? rmShort(p.asking) : "Price TBC"}</div>
        <div class="name">${esc(p.project)}</div>
        <div class="addr">${esc(p.address)}, ${esc(p.area)}</div>
        <div class="chips">${p.chips.map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>
      </div>
    </a>`).join("") : `<div class="empty">No listings match. Clear the search or filters.</div>`;
}

function renderDetail(p) {
  document.title = p.project + " | Team Property Listings";
  cur = 0;
  const full = `${p.address}, ${p.area}`;
  app.innerHTML = `
    <button class="back" id="back">&larr; All listings</button>
    <div class="detail">
      <div>
        <div class="gallery">
          <div class="stage"><img id="main" alt="">
            <button class="nav prev" aria-label="Previous photo" id="prev">&#8249;</button>
            <button class="nav next" aria-label="Next photo" id="next">&#8250;</button>
            <div class="cap"><span id="cap"></span><span id="num"></span></div></div>
          <div class="thumbs" id="thumbs">${p.photos.map((ph, i) => `<button data-i="${i}" aria-label="Photo ${i + 1}: ${esc(ph[1])}"><img src="${esc(ph[0])}" alt="" loading="lazy"></button>`).join("")}</div>
        </div>
        ${p.video ? `<div class="section"><h2>Video walkthrough</h2><video class="vid" controls playsinline preload="metadata" poster="${esc(p.photos[0][0])}" src="${esc(p.video)}"></video></div>` : ""}
        <div class="section"><h2>Description</h2>${p.description.map(l => `<p class="line">${esc(l)}</p>`).join("")}<p class="updated">Updated ${esc(p.updated)}</p></div>
        ${p.docs ? `<div class="section"><h2>Documents</h2>
          ${p.docs.length ? p.docs.map(d => `<details class="doc"><summary>${esc(d[0])} (${d[1].length} ${d[1].length > 1 ? "pages" : "page"})</summary>${d[2] ? `<div class="row"><button class="btn dl" data-pdf="${esc(d[2])}" data-name="${esc(d[0].replace(/[^\w ()-]+/g, "").trim())}.pdf" hidden>Download PDF</button></div>` : ""}<div class="pages">${d[1].map((src, i) => `<img src="${esc(src)}" alt="${esc(d[0])} page ${i + 1}" loading="lazy">`).join("")}</div></details>`).join("") : `<p class="muted">No documents added yet.</p>`}
        </div>` : ""}

      </div>
      <aside class="panel">
        <div><span class="pill ${p.status === "Available" ? "" : "sold"}" style="position:static;display:inline-block;margin-bottom:8px">${esc(p.status)}</span>
          <h1>${esc(p.project)}</h1><div class="addr">${esc(full)}</div></div>
        <div><div class="lbl">Asking price</div><div class="big">${p.asking ? rm(p.asking) : "To be confirmed"}</div></div>
        ${p.owner ? `<div class="own"><span class="lbl">Owner price (internal)</span><b>${rm(p.owner)}</b></div>` : ""}
        <dl class="facts">${p.facts.map(f => `<div><dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd></div>`).join("")}</dl>
        ${p.phone ? `<div><div class="lbl">Contact</div><div class="phone">${esc(p.phone)}</div></div>` : ""}
        <div class="row">
          ${p.wa ? `<a class="btn primary" href="https://wa.me/${esc(p.wa)}" target="_blank" rel="noopener">WhatsApp</a>` : ""}
          <button class="btn" id="copy">Copy summary</button>
        </div>
      </aside>
    </div>`;
  const show = i => {
    cur = (i + p.photos.length) % p.photos.length;
    $("#main").src = p.photos[cur][0]; $("#main").alt = p.photos[cur][1];
    $("#cap").textContent = p.photos[cur][1]; $("#num").textContent = (cur + 1) + " / " + p.photos.length;
    document.querySelectorAll("#thumbs button").forEach((b, k) => b.setAttribute("aria-current", k === cur));
    if (lbOpen) $("#lbimg").src = p.photos[cur][0];
  };
  show(0);
  if (p.photos.length < 2) { $("#prev").hidden = true; $("#next").hidden = true; }
  $("#back").onclick = () => { location.hash = ""; };
  $("#prev").onclick = () => show(cur - 1);
  $("#next").onclick = () => show(cur + 1);
  $("#thumbs").onclick = e => { const b = e.target.closest("button"); if (b) show(+b.dataset.i); };
  $("#main").onclick = () => openLb(p, show);
  $("#copy").onclick = async () => {
    const t = `${p.project}\n${full}\n${p.chips.join(" | ")}\n${p.asking ? "Asking " + rm(p.asking) : "Price TBC"}${p.phone ? "\nContact " + p.phone : ""}\n${location.href.split("#")[0]}#${p.id}`;
    try { await navigator.clipboard.writeText(t); $("#copy").textContent = "Copied"; }
    catch (e) { $("#copy").textContent = "Copy not allowed here"; }
    setTimeout(() => { const c = $("#copy"); if (c) c.textContent = "Copy summary"; }, 1800);
  };
  window.scrollTo(0, 0);
  window._show = show;
}

function openLb(p, show) {
  lbOpen = true;
  const d = document.createElement("div"); d.className = "lb"; d.id = "lb";
  d.innerHTML = `<img id="lbimg" alt=""><button class="x" aria-label="Close">&times;</button><button class="nav prev" aria-label="Previous photo">&#8249;</button><button class="nav next" aria-label="Next photo">&#8250;</button>`;
  document.body.appendChild(d);
  $("#lbimg").src = p.photos[cur][0];
  const close = () => { lbOpen = false; d.remove(); };
  d.querySelector(".x").onclick = close;
  d.querySelector(".prev").onclick = () => show(cur - 1);
  d.querySelector(".next").onclick = () => show(cur + 1);
  d.onclick = e => { if (e.target === d) close(); };
}

document.addEventListener("keydown", e => {
  if (!window._show || !location.hash) return;
  if (e.key === "ArrowLeft") window._show(cur - 1);
  if (e.key === "ArrowRight") window._show(cur + 1);
  if (e.key === "Escape" && lbOpen) { lbOpen = false; $("#lb").remove(); }
});
window.addEventListener("hashchange", () => { const l = $("#lb"); if (l) { l.remove(); lbOpen = false; } route(); });
route();
</script>
